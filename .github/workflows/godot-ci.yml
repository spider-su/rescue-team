name: Godot Game CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rescue-team-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_RELEASE: '4.7.2-stable'
  GODOT_TEMPLATE_VERSION: '4.7.2.stable'

jobs:
  android-debug-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.1" "cmdline-tools;latest" "cmake;3.10.2.4988404" "ndk;28.1.13356709"

      - name: Download pinned Godot editor and matching export templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot" "$HOME/.local/share/godot/export_templates/$GODOT_TEMPLATE_VERSION"
          base="https://github.com/godotengine/godot/releases/download/$GODOT_RELEASE"
          curl -fL --retry 3 "$base/Godot_v${GODOT_RELEASE}_linux.x86_64.zip" -o "$RUNNER_TEMP/editor.zip"
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  $RUNNER_TEMP/editor.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/editor.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v${GODOT_RELEASE}_linux.x86_64"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
          ln -s "$RUNNER_TEMP/godot/Godot_v${GODOT_RELEASE}_linux.x86_64" "$RUNNER_TEMP/godot/godot"
          curl -fL --retry 3 "$base/Godot_v${GODOT_RELEASE}_export_templates.tpz" -o "$RUNNER_TEMP/templates.tpz"
          echo "f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011  $RUNNER_TEMP/templates.tpz" | sha256sum -c -
          target="$HOME/.local/share/godot/export_templates/$GODOT_TEMPLATE_VERSION"
          unzip -j -q "$RUNNER_TEMP/templates.tpz" "templates/android_debug.apk" "templates/android_release.apk" "templates/version.txt" -d "$target"
          test -s "$target/android_debug.apk"
          "$RUNNER_TEMP/godot/godot" --version

      - name: Import and validate Godot project
        run: godot --headless --path . --editor --import --quit

      - name: Run GDScript logic tests
        run: godot --headless --path . --script res://tests/test_rescue_level.gd

      - name: Validate mission data, solutions and saved progress
        run: godot --headless --path . --script res://tests/test_campaign.gd

      - name: Verify Old Town solutions, ranger rules and save compatibility
        run: godot --headless --path . --script res://tests/test_old_town.gd

      - name: Verify audio assets, settings and app lifecycle
        run: godot --headless --path . --script res://tests/test_audio.gd

      - name: Verify fair stars, Floodworks and resumable puzzle journals
        run: godot --headless --path . --script res://tests/test_puzzle_polish.gd

      - name: Boot the game scene headlessly
        run: godot --headless --path . --quit-after 5

      - name: Verify UI navigation, rescue flow and adaptive tile input
        run: godot --headless --path . --script res://tests/test_rescue_ui.gd

      - name: Configure Android debug signing key
        shell: bash
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android" build
          if [[ -n "$DEBUG_KEYSTORE_BASE64" ]]; then
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
            echo "Using persistent debug signing key from GitHub Actions secret."
          else
            echo "::warning::ANDROID_DEBUG_KEYSTORE_BASE64 is not configured. Generating a new temporary signing key; Android will reject upgrades over earlier builds."
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=CI,C=US"
          fi
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey > /dev/null
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Configure Godot Android SDK/JDK settings
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          EOF

      - name: Export installable debug APK
        run: |
          godot --headless --path . --export-debug "Android" build/game-debug.apk
          test -s build/game-debug.apk

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v7
        with:
          name: rescue-team-debug-apk
          path: build/game-debug.apk
          if-no-files-found: error
          retention-days: 14
